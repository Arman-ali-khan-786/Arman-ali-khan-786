<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Hope is not a strategy. Build it reliable." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c5364"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#0f2027"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .q { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; animation: fade 1.5s ease both; }
  </style>
  <rect width="1200" height="110" rx="18" fill="url(#bg)"/>
  <text class="q" x="600" y="64" text-anchor="middle" font-size="24" font-style="italic" fill="#e6f4fb">"Hope is not a strategy. Build it reliable."</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
