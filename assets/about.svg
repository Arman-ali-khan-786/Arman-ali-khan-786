<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="About Arman Ali Khan" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#7ee8c1"/>
    </linearGradient>
  </defs>
  <style>
    .m { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; }
    .k { fill: #58a6ff; }
    .v { fill: #c9d1d9; }
    .g { fill: #3fb950; }
    .d { fill: #8b949e; }
    .y { fill: #e3b341; }
    @keyframes in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes glow { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
    .l1 { animation: in .6s .2s ease both; }
    .l2 { animation: in .6s .6s ease both; }
    .l3 { animation: in .6s 1.0s ease both; }
    .l4 { animation: in .6s 1.4s ease both; }
    .l5 { animation: in .6s 1.8s ease both; }
    .l6 { animation: in .6s 2.2s ease both; }
    .cur { animation: blink 1s steps(1) infinite; }
    .ring { animation: glow 3s ease-in-out infinite; }
  </style>

  <rect x="1" y="1" width="958" height="328" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 13a12 12 0 0 1 12-12h934a12 12 0 0 1 12 12v32H1z" fill="#161b22"/>
  <line x1="1" y1="45" x2="959" y2="45" stroke="#30363d"/>
  <circle cx="28" cy="23" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="23" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="23" r="7" fill="#27c93f"/>
  <text class="m d" x="480" y="28" text-anchor="middle">arman@sre: ~/about</text>

  <g class="m">
    <text class="l1" x="36" y="84"><tspan class="g">$</tspan> <tspan class="v">cat about.md</tspan></text>

    <text class="l2" x="36" y="128"><tspan class="k">name</tspan></text>
    <text class="l2" x="160" y="128"><tspan class="d">→</tspan> <tspan class="v">Arman Ali Khan</tspan></text>

    <text class="l3" x="36" y="162"><tspan class="k">role</tspan></text>
    <text class="l3" x="160" y="162"><tspan class="d">→</tspan> <tspan class="v">Site Reliability Engineer @ Plivo Inc.</tspan></text>

    <text class="l4" x="36" y="196"><tspan class="k">education</tspan></text>
    <text class="l4" x="160" y="196"><tspan class="d">→</tspan> <tspan class="v">B.Tech CSE · ITER, SOA University · 9.14 CGPA</tspan></text>

    <text class="l5" x="36" y="230"><tspan class="k">focus</tspan></text>
    <text class="l5" x="160" y="230"><tspan class="d">→</tspan> <tspan class="y">Reliability</tspan><tspan class="d"> · </tspan><tspan class="y">Observability</tspan><tspan class="d"> · </tspan><tspan class="y">DevSecOps</tspan></text>
    <text class="l5" x="160" y="254"><tspan class="d" xml:space="preserve">  </tspan><tspan class="y">FinOps</tspan><tspan class="d"> · </tspan><tspan class="y">Automation</tspan></text>

    <text class="l6" x="36" y="296"><tspan class="g">$</tspan> <tspan class="v">building projects that matter</tspan><tspan class="g cur"> █</tspan></text>
  </g>

  <g>
    <circle class="ring" cx="830" cy="165" r="78" fill="#161b22" stroke="url(#ring)" stroke-width="4"/>
    <circle cx="830" cy="165" r="62" fill="none" stroke="#30363d" stroke-dasharray="3 7"/>
