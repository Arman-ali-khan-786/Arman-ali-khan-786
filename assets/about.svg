    <text x="830" y="274" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" fill="#8b949e">SRE · DevSecOps</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
