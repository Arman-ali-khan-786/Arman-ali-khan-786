<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Arman Ali Khan - Site Reliability Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#7ee8c1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
    .a1 { animation: fade 1s ease both; }
    .a2 { animation: fade 1s .35s ease both; }
    .a3 { animation: fade 1s .7s ease both; }
    .f1 { animation: float 7s ease-in-out infinite; }
    .f2 { animation: float 9s ease-in-out infinite reverse; }
    .p  { animation: pulse 3s ease-in-out infinite; }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <circle class="f1" cx="130" cy="70" r="90" fill="#36bcf7" fill-opacity="0.08"/>
    <circle class="f2" cx="1080" cy="200" r="120" fill="#7ee8c1" fill-opacity="0.07"/>
    <circle class="f1" cx="980" cy="50" r="40" fill="none" stroke="#36bcf7" stroke-opacity="0.3" stroke-width="2"/>
    <circle class="p" cx="220" cy="210" r="5" fill="#7ee8c1"/>
    <circle class="p" cx="1000" cy="120" r="4" fill="#36bcf7"/>
    <circle class="p" cx="160" cy="150" r="3" fill="#ffffff"/>

    <text class="t a1" x="600" y="112" text-anchor="middle" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="3">ARMAN ALI KHAN</text>
    <rect class="a2" x="540" y="130" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text class="t a2" x="600" y="172" text-anchor="middle" font-size="25" font-weight="600" fill="url(#accent)">Site Reliability Engineer  |  Cloud &amp; DevSecOps</text>
    <text class="t a3" x="600" y="212" text-anchor="middle" font-size="16" fill="#cfe3ee" letter-spacing="3">AWS  ·  KUBERNETES  ·  TERRAFORM  ·  OBSERVABILITY  ·  AUTOMATION</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
